org.gradle.caching=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true

VERSION_NAME=1.27.3

android.useAndroidX=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

systemProp.org.gradle.internal.http.socketTimeout=120000

kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.stability.nowarn=true
kotlin.mpp.commonizerLogLevel=info
kotlin.mpp.enableCInteropCommonization=true

# Signals to our own plugin that we are building within the repo.
app.cash.zipline.internal=true

# AGP 9 refuses com.android.library / com.android.application alongside the Kotlin Multiplatform
# plugin and points at com.android.kotlin.multiplatform.library instead. That plugin's DSL has no
# externalNativeBuild, buildTypes, ndk or defaultConfig, so it cannot express this build (QuickJS is
# compiled from CMake per build type; the demo is an Android application, which the KMP plugin does
# not cover at all). These are AGP's own documented opt-outs for exactly that case.
android.builtInKotlin=false
android.newDsl=false
